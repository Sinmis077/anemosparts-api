spring.application.name=anemosparts

server.port=8080
server.address=0.0.0.0

app.image.max.size=1048576
app.upload.dir=tests/uploads/images
app.access.src=http://localhost:8080/resources/images/

# Datasource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATASOURCE_JDBC_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# JPA configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.connection.autocommit=false

# Flyway configuration
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

app.dns.origin=http://localhost:5173/

app.stripe.api.key=${STRIPE_API_KEY}
app.payment.stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.success.url=http://localhost:5173/success
app.stripe.cancel.url=http://localhost:5173/fail

app.payment.shipping.rate=10

app.security.jwt.secret=OGI2M2E0YWE2MTk5OTg5MjFhODBlMmI0MzljNmRlYjFkMmFkZGIxODQ1OWFkZDQ2MWM3MDY1M2JkNWZlMjRlNA==
app.security.jwt.expiry=3600

spring.security.user.name=user
spring.security.user.password=password

# Logging levels DEBUG, TRACE, INFO, WARN, ERROR, OFF
logging.level.web=ERROR
logging.level.org.hibernate=ERROR

logging.level.dev.ioannis.anemosparts=DEBUG