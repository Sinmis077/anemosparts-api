spring.application.name=anemosparts

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS}

app.dns.origin=${DNS_ORIGIN}

spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATASOURCE_JDBC_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

app.image.max.size=${MAX_IMAGE_SIZE}
app.upload.dir=${DEFAULT_UPLOAD_DIR}
app.access.src=${DEFAULT_ACCESS_SRC}

app.stripe.api.key=${STRIPE_API_KEY}
app.payment.stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.success.url=${STRIPE_SUCCESS_URL}
app.stripe.cancel.url=${STRIPE_CANCEL_URL}

app.payment.shipping.rate=${SHIPPING_RATE}

app.security.jwt.secret=${JWT_KEY}
app.security.jwt.expiry=${JWT_EXPIRY}

spring.security.user.name=user
spring.security.user.password=password

# Logging levels DEBUG, TRACE, INFO, WARN, ERROR, OFF
logging.level.web=ERROR
logging.level.org.hibernate=ERROR

logging.level.dev.ioannis.anemosparts=DEBUG