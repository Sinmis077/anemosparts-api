name: Run build, test jobs

on:
  push:
    branches-ignore:
      - main
jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle without tests
        run: ./gradlew build -x test

  Test:
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: 21

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew executable
        run: chmod +x ./gradlew

      - name: Execute tests
        run: ./gradlew test